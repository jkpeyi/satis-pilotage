name: satis-pilotage

x-app: &app
  image: satis-pilotage-app
  build:
    context: .
    target: app
  env_file: .env
  environment:
    DB_HOST: mysql
  volumes:
    - storage:/var/www/html/storage
  depends_on:
    mysql:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *app

  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600"]

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]

  web:
    image: satis-pilotage-web
    build:
      context: .
      target: web
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - app
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Only used by deploy.sh: runs `composer check` against the satis_test database.
  test:
    image: satis-pilotage-test
    build:
      context: .
      target: test
    profiles: ["test"]
    env_file: .env
    environment:
      DB_HOST: mysql
      APP_ENV: testing
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  storage:
  mysql-data:
